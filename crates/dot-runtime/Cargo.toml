[package]
name = "dot-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "fake-llama-server"
path = "tests/support/fake_llama_server.rs"
test = false
doc = false

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["macros", "process", "rt", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
dot-models = { path = "../dot-models" }
dot-providers = { path = "../dot-providers" }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
