[package]
name = "dot-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
async-stream = "0.3.6"
dot-providers = { path = "../dot-providers" }
futures-util = "0.3.34"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["sync"] }
tokio-util = "0.7.19"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
