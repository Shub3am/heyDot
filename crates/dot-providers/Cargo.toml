[package]
name = "dot-providers"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
async-stream = "0.3.6"
base64 = "0.23.1"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
serde_json = "1.0.151"
