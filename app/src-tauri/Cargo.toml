[package]
name = "hey-dot"
version = "0.1.0"
description = "Local-first voice and screen assistant"
authors = ["Shubham Vishwakarma"]
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "hey_dot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dot-models = { path = "../../crates/dot-models" }
dot-providers = { path = "../../crates/dot-providers" }
dot-runtime = { path = "../../crates/dot-runtime" }
dot-screen = { path = "../../crates/dot-screen" }
dot-settings = { path = "../../crates/dot-settings" }
futures-util = "0.3.34"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
